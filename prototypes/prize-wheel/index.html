<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaceFinder — A Volta da Sorte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#111111;
    --night-2:#1C1C1C;
    --deep:#333333;
    --clay:#EB4D00;
    --clay-dark:#B23A00;
    --gold:#EB4D00;
    --plum:#8C2F12;
    --sand:#D9D2C4;
    --chalk:#F5F3EF;
    --chalk-dim:#E7E3DA;
    --ink:#111111;
    --ink-soft:rgba(17,17,17,.68);
    --font-display:'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(235,77,0,.18), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(255,255,255,.06), transparent 45%),
      var(--night);
    color:var(--chalk);
    font-family:var(--font-body);
    height:100dvh;
    overflow:hidden;
    position:relative;
  }

  *:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }

  .app{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    max-width:760px;
    margin:0;
    padding:28px 20px 64px;
    transform:translate(-50%,-50%);
    transition:transform .15s ease;
  }
  @media (prefers-reduced-motion: reduce){
    .app{ transition:none; }
  }

  .lang-switch{
    display:inline-flex;
    gap:2px;
    padding:3px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    margin-bottom:16px;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:var(--sand);
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    padding:6px 14px;
    border-radius:16px;
    cursor:pointer;
  }
  .lang-btn:hover{ color:var(--chalk); }
  .lang-btn[aria-pressed="true"]{ background:var(--clay); color:#FFFFFF; }

  .topbar{ text-align:center; margin-bottom:36px; }
  .brand-logo{
    width:min(340px,66vw);
    margin:0 auto;
  }
  .brand-logo svg{ display:block; width:100%; height:auto; }
  .page-kicker{
    font-family:var(--font-display);
    font-size:clamp(34px,6vw,52px);
    letter-spacing:.02em;
    color:var(--clay);
    margin:18px 0 0;
    line-height:1.05;
  }
  .tagline{
    margin:8px auto 0;
    color:var(--sand);
    font-size:clamp(10px,2.6vw,17px);
    line-height:1.4;
    letter-spacing:.01em;
    white-space:nowrap;
  }

  .layout{
    display:flex;
    justify-content:center;
  }

  /* ---------- wheel stage ---------- */
  .wheel-stage{
    position:relative;
    width:100%;
    background:var(--night-2);
    border:1px solid rgba(217,164,65,.18);
    border-radius:20px;
    padding:32px 24px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .settings-btn{
    position:absolute;
    top:16px;
    right:16px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px 8px 10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    color:var(--sand);
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .settings-btn:hover{ color:var(--chalk); border-color:rgba(255,255,255,.32); }
  .settings-btn svg{ width:16px; height:16px; flex:none; }

  .pointer{
    width:0; height:0;
    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-top:27px solid var(--gold);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
    margin-bottom:-4px;
    z-index:3;
  }

  .wheel-btn{
    display:block;
    width:min(580px,92vw);
    aspect-ratio:1/1;
    margin:0 auto;
    padding:0;
    border:none;
    background:none;
    cursor:pointer;
    border-radius:50%;
    transition:transform .15s ease;
  }
  .wheel-btn:hover:not(:disabled){ transform:scale(1.015); }
  .wheel-btn:active:not(:disabled){ transform:scale(0.985); }
  .wheel-btn:disabled{ cursor:not-allowed; }
  .wheel-btn:disabled .wheel-wrap{ opacity:.55; }
  .wheel-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:6px; }

  .wheel-wrap{
    position:relative;
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:0 0 0 8px var(--night), 0 0 0 11px var(--gold), 0 18px 40px rgba(0,0,0,.45);
    transform:rotate(0deg);
  }
  @media (prefers-reduced-motion: reduce){
    .wheel-wrap{ transition:none !important; animation:none !important; }
  }
  .wheel-wrap canvas{
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
  }
  @keyframes wheel-invite{
    0%,100%{ box-shadow:0 0 0 8px var(--night), 0 0 0 11px var(--gold), 0 18px 40px rgba(0,0,0,.45); }
    50%{ box-shadow:0 0 0 8px var(--night), 0 0 0 14px var(--gold), 0 22px 46px rgba(0,0,0,.5); }
  }
  .wheel-wrap.is-idle{ animation:wheel-invite 2.6s ease-in-out infinite; }

  .hub{
    position:absolute; inset:0;
    margin:auto;
    width:19%; height:19%;
    background:var(--gold);
    border:3px solid var(--night);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .hub-icon{
    width:56%;
    height:56%;
    display:block;
  }

  .spin-hint{ min-height:18px; margin:18px 0 0; font-size:13px; color:var(--sand); text-align:center; }


  /* ---------- settings drawer ---------- */
  .settings-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,.55);
    z-index:58;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .settings-backdrop.is-open{ opacity:1; pointer-events:auto; }

  .config-panel{
    position:fixed;
    top:0;
    right:0;
    height:100vh;
    height:100dvh;
    width:min(440px,92vw);
    overflow-y:auto;
    background:var(--chalk);
    color:var(--ink);
    padding:24px;
    border-top-left-radius:20px;
    border-bottom-left-radius:20px;
    box-shadow:-24px 0 50px rgba(0,0,0,.45);
    z-index:60;
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.16,.84,.44,1);
  }
  .config-panel.is-open{ transform:translateX(0); }
  @media (prefers-reduced-motion: reduce){
    .config-panel{ transition:none; }
  }
  .config-header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .close-settings-btn{
    flex:none;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid rgba(22,36,29,.15);
    background:transparent;
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .close-settings-btn:hover{ background:rgba(22,36,29,.06); color:var(--ink); }
  .close-settings-btn svg{ width:16px; height:16px; }
  .config-header h2{ font-family:var(--font-display); font-size:24px; letter-spacing:.03em; margin:0; }
  .config-header p{ margin:10px 0 18px; font-size:13px; color:var(--ink-soft); line-height:1.5; }

  .prize-list{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; }
  .prize-row{
    display:grid;
    grid-template-columns:auto auto 1fr 56px auto;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid rgba(22,36,29,.1);
    border-radius:10px;
    padding:8px 10px;
  }
  .prize-row.is-disabled{ opacity:.5; }
  .prize-row .swatch{ width:12px; height:12px; border-radius:3px; flex:none; }
  .prize-row input[type="checkbox"]{ width:17px; height:17px; accent-color:var(--clay); cursor:pointer; }
  .prize-row .label-field{
    display:flex; align-items:center; gap:8px; min-width:0;
  }
  .prize-row input[type="text"]{
    border:none; background:transparent; font:600 14px var(--font-body); color:var(--ink);
    width:100%; padding:4px 2px;
  }
  .prize-row input[type="number"]{
    width:100%; border:1px solid rgba(22,36,29,.15); border-radius:6px;
    padding:5px 4px; font:600 12px var(--font-mono); text-align:center; color:var(--ink);
  }
  .prize-row .remove-btn{
    border:none; background:transparent; color:var(--plum); cursor:pointer;
    font-size:16px; line-height:1; padding:4px 6px; border-radius:6px;
  }
  .prize-row .remove-btn:hover{ background:rgba(122,59,74,.1); }
  .star-toggle{
    border:none; background:transparent; cursor:pointer;
    width:24px; height:24px; padding:2px; border-radius:6px;
    color:rgba(22,36,29,.28);
    display:flex; align-items:center; justify-content:center;
  }
  .star-toggle svg{ width:17px; height:17px; }
  .star-toggle:hover{ background:rgba(22,36,29,.06); color:rgba(22,36,29,.5); }
  .star-toggle[aria-pressed="true"]{ color:#E0A200; }
  .star-toggle[aria-pressed="true"] svg{ fill:#FFB800; stroke:#E0A200; }
  .odds-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); display:block; text-align:center; margin-bottom:2px; }

  .add-prize-form{
    display:grid;
    grid-template-columns:1fr 56px auto;
    gap:8px;
    margin-bottom:12px;
  }
  .add-prize-form input[type="text"]{
    border:1px solid rgba(22,36,29,.18); border-radius:8px; padding:9px 10px;
    font:500 13px var(--font-body); color:var(--ink);
  }
  .add-prize-form input[type="number"]{
    border:1px solid rgba(22,36,29,.18); border-radius:8px; padding:9px 4px;
    font:600 13px var(--font-mono); text-align:center; color:var(--ink);
  }
  .add-prize-form button{
    border:none; border-radius:8px; background:var(--night); color:var(--chalk);
    font:600 13px var(--font-body); padding:9px 16px; cursor:pointer;
  }
  .add-prize-form button:hover{ background:var(--night-2); }

  .reset-btn{
    width:100%; border:1px solid rgba(22,36,29,.2); background:transparent; color:var(--ink-soft);
    border-radius:8px; padding:9px; font:600 12px var(--font-body); letter-spacing:.02em; cursor:pointer;
  }
  .reset-btn:hover{ background:rgba(22,36,29,.06); color:var(--ink); }

  /* ---------- result overlay ---------- */
  .result-overlay{
    position:fixed; inset:0; background:rgba(19,42,34,.82);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
    overflow:hidden;
  }
  .result-overlay[hidden]{ display:none; }
  .result-overlay::before{
    content:'';
    position:absolute; inset:-15%;
    background:radial-gradient(circle at center, rgba(235,77,0,.55), rgba(235,77,0,0) 60%);
    pointer-events:none;
    z-index:0;
    animation:overlay-glow-pulse 2.4s ease-in-out infinite;
  }
  @keyframes overlay-glow-pulse{
    0%,100%{ opacity:.5; transform:scale(1); }
    50%{ opacity:.85; transform:scale(1.1); }
  }

  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .confetti-piece{
    position:absolute; top:-24px; width:8px; height:14px; opacity:.95;
    animation:confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(115vh) rotate(360deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .confetti-piece{ display:none; }
    .result-overlay::before{ animation:none; }
    .bib-card{ animation:none; }
  }

  .bib-card{
    position:relative;
    z-index:1;
    width:min(480px,94vw);
    background:var(--chalk);
    color:var(--ink);
    border-radius:8px;
    padding:60px 40px 48px;
    text-align:center;
    transform:rotate(-1.2deg);
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(to bottom, transparent 0 7px, rgba(22,36,29,.08) 7px 8px);
    background-size:100% 100%;
    animation:bib-pop .5s cubic-bezier(.2,.9,.25,1.2) both;
  }
  @keyframes bib-pop{
    0%{ transform:scale(.8) rotate(-1.2deg); opacity:0; }
    60%{ transform:scale(1.04) rotate(-1.2deg); opacity:1; }
    100%{ transform:scale(1) rotate(-1.2deg); opacity:1; }
  }
  .bib-pin{
    position:absolute; top:16px; left:16px; width:16px; height:16px; border-radius:50%;
    background:linear-gradient(135deg,#fff,#b9b9b9);
    box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 0 0 2px rgba(0,0,0,.15);
  }
  .bib-close{
    position:absolute; top:14px; right:14px;
    width:36px; height:36px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff,#b9b9b9);
    border:none;
    box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 0 0 2px rgba(0,0,0,.15);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .bib-close:hover{ background:linear-gradient(135deg,#fff,#e2e2e2); }
  .bib-close svg{ width:16px; height:16px; }
  .bib-eyebrow{
    font-family:var(--font-mono); font-size:14px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--clay-dark); margin:0 0 10px; font-weight:600;
  }
  .bib-prize{
    font-family:var(--font-display); font-size:clamp(34px,8vw,54px); line-height:1.02;
    letter-spacing:.02em; margin:0; color:var(--ink);
  }
</style>
</head>

<script>
(function(){
  "use strict";

  // Paste the Web App URL from your Apps Script deployment here (ends in /exec).

  var LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbxaV0n4K9rYDbq7U_9IJSzv_X-7iK1o7i11WmP1hJ223VACb2daf6i3gEFyr8axsExW/exec";

  var PALETTE = [
    { bg:"#EB4D00", text:"#FFFFFF" }, // RaceFinder orange
    { bg:"#111111", text:"#FFFFFF" }, // Black
    { bg:"#F5F3EF", text:"#111111" }, // Paper
    { bg:"#B23A00", text:"#FFFFFF" }, // Deep rust
    { bg:"#D9D2C4", text:"#111111" }, // Sand
    { bg:"#333333", text:"#FFFFFF" }  // Charcoal
  ];

  // Reserved exclusively for highlighted/featured prizes so it's never used
  // for a regular slice and always reads as "special" at a glance.
  var HIGHLIGHT_COLOR = { bg:"#FFB800", text:"#111111" };

  var I18N = {
    pt: {
      docTitle: "RaceFinder — A Volta da Sorte",
      kicker: "A Volta da Sorte",
      tagline: "Dá uma volta e leva um prémio para a tua próxima prova.",

      ariaSpinWheel: "Toca na roda para rodar",
      hintNotEnough: "Adiciona pelo menos dois prémios ativos para rodar.",
      hintSpinning: "A rodar…",
      settingsBtnLabel: "Prémios",

      configHeading: "Configurar prémios",
      configDesc: "Ativa ou desativa prémios e a roda atualiza-se automaticamente. As odds definem a largura de cada fatia — um prémio com odds 3 é três vezes mais provável do que um com odds 1.",
      newPrizePlaceholder: "Novo prémio, ex.: inscrição grátis",
      addBtn: "Adicionar",
      resetBtn: "Repor predefinições",
      oddsLabel: "Odds",
      ariaPrizeActive: "Prémio ativo",
      ariaHighlight: "Destacar prémio",
      ariaPrizeName: "Nome do prémio",
      ariaOddsWeight: "Peso das odds",
      ariaRemove: "Remover prémio",
      ariaNewPrizeName: "Nome do novo prémio",
      canvasEmpty: "Adiciona um prémio para começar",
      resultEyebrow: "Ganhaste",
      close: "Fechar",
      locale: "pt-PT"
    },
    en: {
      docTitle: "RaceFinder — The Lucky Lap",
      kicker: "The Lucky Lap",
      tagline: "Take a spin and score a prize for your next race.",
      hintTapWheel: "Tap the wheel to spin",
      ariaSpinWheel: "Tap the wheel to spin",
      hintNotEnough: "Add at least two active prizes to spin.",
      hintSpinning: "Spinning…",
      settingsBtnLabel: "Prizes",
      ariaSettings: "Configure prizes",
      configHeading: "Configure prizes",
      configDesc: "Turn prizes on or off and the wheel updates automatically. Odds set how wide each slice is — a prize with odds of 3 is three times as likely as one with odds of 1.",
      newPrizePlaceholder: "New prize, e.g. Free race entry",
      addBtn: "Add",
      resetBtn: "Reset to defaults",
      oddsLabel: "Odds",
      ariaPrizeActive: "Prize active",
      ariaHighlight: "Feature prize",
      ariaPrizeName: "Prize name",
      ariaOddsWeight: "Odds weight",
      ariaRemove: "Remove prize",
      ariaNewPrizeName: "New prize name",
      canvasEmpty: "Add a prize to start",
      resultEyebrow: "You won",
      close: "Close",
      locale: "en-GB"
    }
  };

  var PRIZE_I18N = {
    freeEntry: { pt:"Inscrição grátis",         en:"Free race entry" },
    buff:      { pt:"Buff RaceFinder",          en:"RaceFinder buff" },
    cap:       { pt:"Boné RaceFinder",          en:"RaceFinder cap" },
    bottle:    { pt:"Garrafa RaceFinder",       en:"RaceFinder bottle" },
    tshirt:    { pt:"T-shirt RaceFinder",       en:"RaceFinder t-shirt" }
  };

  // Odds reflect the requested rarity: easy > medium > medium-hard > hard > very hard
  var DEFAULT_PRIZES = [
    { key:"freeEntry", weight:1, enabled:true, highlighted:true }, // Very hard to get
    { key:"buff",      weight:5, enabled:true },                   // Medium
    { key:"cap",       weight:8, enabled:true },                   // Easy to get
    { key:"bottle",    weight:3, enabled:true },                   // Medium-hard
    { key:"tshirt",    weight:2, enabled:true }                    // Hard to get
  ];

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var nextId = 1;
  function makePrizes(list){
    return list.map(function(p){
      return { id:"p" + (nextId++), key:p.key, customLabel:null, weight:p.weight, enabled:p.enabled, highlighted:!!p.highlighted };
    });
  }

  var state = {
    lang: "pt",
    prizes: makePrizes(DEFAULT_PRIZES),
    slices: [],
    sliceOrder: [],
    sliceOrderSignature: null,
    rotation: 0,
    spinning: false
  };

  function prizeLabel(p){
    if (p.customLabel != null) return p.customLabel;
    if (p.key && PRIZE_I18N[p.key]) return PRIZE_I18N[p.key][state.lang];
    return "";
  }

  // Arranges repeated prize-id units around the wheel so identical prizes land
  // as far apart as possible, minimizing (and, whenever mathematically
  // possible, eliminating) two same-prize slices sitting next to each other.
  function buildMixedSliceOrder(items){
    var total = items.reduce(function(sum, it){ return sum + it.count; }, 0);
    var slots = new Array(total).fill(null);
    var byCountDesc = items.slice().sort(function(a, b){ return b.count - a.count; });

    byCountDesc.forEach(function(item){
      var step = total / item.count;
      var phase = Math.random() * step; // random rotation so repeated configs don't always look identical
      for (var i = 0; i < item.count; i++){
        var pos = Math.round(phase + i * step) % total;
        if (pos < 0) pos += total;
        if (slots[pos] === null){
          slots[pos] = item.id;
          continue;
        }
        for (var offset = 1; offset <= total; offset++){
          var posPlus = (pos + offset) % total;
          var posMinus = ((pos - offset) % total + total) % total;
          if (slots[posPlus] === null){ slots[posPlus] = item.id; break; }
          if (slots[posMinus] === null){ slots[posMinus] = item.id; break; }
        }
      }
    });

    var n = slots.length;
    function violatesAt(i){ return slots[i] === slots[(i + 1) % n]; }
    for (var pass = 0; pass < 3; pass++){
      var fixedAny = false;
      for (var i = 0; i < n; i++){
        if (!violatesAt(i)) continue;
        var badPos = (i + 1) % n;
        for (var j = 0; j < n; j++){
          if (j === badPos || j === i) continue;
          var tmp = slots[badPos]; slots[badPos] = slots[j]; slots[j] = tmp;
          var stillBad = violatesAt(i) ||
            violatesAt((badPos - 1 + n) % n) || violatesAt(badPos) ||
            violatesAt((j - 1 + n) % n) || violatesAt(j);
          if (!stillBad){ fixedAny = true; break; }
          tmp = slots[badPos]; slots[badPos] = slots[j]; slots[j] = tmp; // revert
        }
      }
      if (!fixedAny) break;
    }
    return slots;
  }

  var wheelWrap   = document.getElementById("wheelWrap");
  var canvas      = document.getElementById("wheelCanvas");
  var ctx         = canvas.getContext("2d");
  var spinBtn     = document.getElementById("spinBtn");
  var spinHint    = document.getElementById("spinHint");
  var prizeListEl = document.getElementById("prizeList");
  var addForm     = document.getElementById("addPrizeForm");
  var newLabelEl  = document.getElementById("newPrizeLabel");
  var newWeightEl = document.getElementById("newPrizeWeight");
  var resetBtn    = document.getElementById("resetBtn");
  var overlay     = document.getElementById("resultOverlay");
  var resultTitle = document.getElementById("resultTitle");
  var confettiLayer = document.getElementById("confettiLayer");
  var closeResultBtn = document.getElementById("closeResultBtn");
  var langPtBtn   = document.getElementById("langPt");
  var langEnBtn   = document.getElementById("langEn");
  var settingsBtn = document.getElementById("settingsBtn");
  var closeSettingsBtn = document.getElementById("closeSettingsBtn");
  var settingsPanel = document.getElementById("settingsPanel");
  var settingsBackdrop = document.getElementById("settingsBackdrop");
  var appEl = document.getElementById("app");

  // ---------- wheel rendering ----------
  function drawStar(cx, cy, outerR, innerR, fill){
    var spikes = 5;
    var rot = (Math.PI / 2) * 3;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (var i = 0; i < spikes; i++){
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function truncateForCanvas(text, maxWidth, font){
    ctx.font = font;
    if (ctx.measureText(text).width <= maxWidth) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth){
      t = t.slice(0, -1);
    }
    return t + "…";
  }

  function greedyWrapWords(text, maxWidth, font){
    ctx.font = font;
    var words = text.split(" ");
    var lines = [];
    var current = "";
    words.forEach(function(word){
      var candidate = current ? current + " " + word : word;
      if (!current || ctx.measureText(candidate).width <= maxWidth){
        current = candidate;
      } else {
        lines.push(current);
        current = word;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function fitLabelToLines(text, maxWidth, maxLines, baseFontSize, minFontSize, fontFamily){
    var fs = baseFontSize;
    var font = "";
    var lines = [];
    for (; fs >= minFontSize; fs--){
      font = "600 " + fs + "px '" + fontFamily + "'";
      lines = greedyWrapWords(text, maxWidth, font);
      ctx.font = font;
      var allFit = lines.length <= maxLines && lines.every(function(l){ return ctx.measureText(l).width <= maxWidth; });
      if (allFit) return { lines: lines, fontSize: fs };
    }
    // floor reached: force-fit at the minimum size, truncating whatever still overflows
    font = "600 " + minFontSize + "px '" + fontFamily + "'";
    ctx.font = font;
    if (lines.length > maxLines){
      var kept = lines.slice(0, maxLines - 1);
      kept.push(truncateForCanvas(lines.slice(maxLines - 1).join(" "), maxWidth, font));
      lines = kept;
    }
    lines = lines.map(function(l){
      return ctx.measureText(l).width <= maxWidth ? l : truncateForCanvas(l, maxWidth, font);
    });
    return { lines: lines, fontSize: minFontSize };
  }

  function renderWheel(){
    var enabled = state.prizes.filter(function(p){ return p.enabled && p.weight > 0; });
    var size = canvas.width;
    var cx = size / 2, cy = size / 2, r = size / 2 - 6;

    ctx.clearRect(0, 0, size, size);

    if (enabled.length === 0){
      ctx.fillStyle = "#1C1C1C";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#D9D2C4";
      ctx.font = "600 20px 'Work Sans', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(I18N[state.lang].canvasEmpty, cx, cy);
      state.slices = [];
      updateSpinAvailability();
      return;
    }

    var colorMap = {};
    enabled.forEach(function(p, i){ colorMap[p.id] = p.highlighted ? HIGHLIGHT_COLOR : PALETTE[i % PALETTE.length]; });

    var signature = enabled.map(function(p){
      return p.id + ":" + Math.max(1, Math.round(p.weight));
    }).join("|");

    if (signature !== state.sliceOrderSignature){
      var items = enabled.map(function(p){
        return { id: p.id, count: Math.max(1, Math.round(p.weight)) };
      });
      state.sliceOrder = buildMixedSliceOrder(items);
      state.sliceOrderSignature = signature;
    }

    var prizeById = {};
    enabled.forEach(function(p){ prizeById[p.id] = p; });

    var totalUnits = state.sliceOrder.length;
    var unitSpan = 360 / totalUnits;
    var cumulative = 0;
    var slices = [];

    state.sliceOrder.forEach(function(id){
      var p = prizeById[id];
      var start = cumulative;
      var end = cumulative + unitSpan;
      cumulative = end;
      slices.push({
        id: id,
        label: prizeLabel(p),
        start: start,
        end: end,
        color: colorMap[id],
        highlighted: !!(p && p.highlighted)
      });
    });
    state.slices = slices;

    var baseFontSize = Math.max(14, Math.min(28, 340 / slices.length));
    var minFontSize = 11;
    var maxLines = 3;
    var innerBound = r * 0.26;
    var outerBound = r - 12;
    var maxLineWidth = outerBound - innerBound;
    var labelRadius = (innerBound + outerBound) / 2;

    slices.forEach(function(slice){
      var startRad = (slice.start - 90) * Math.PI / 180;
      var endRad   = (slice.end   - 90) * Math.PI / 180;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startRad, endRad);
      ctx.closePath();
      ctx.fillStyle = slice.color.bg;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#111111";
      ctx.stroke();

      var midDeg = (slice.start + slice.end) / 2;
      var midRad = (midDeg - 90) * Math.PI / 180;

      var fit = fitLabelToLines(slice.label.toUpperCase(), maxLineWidth, maxLines, baseFontSize, minFontSize, "Bebas Neue");
      var lineHeight = fit.fontSize * 1.08;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(midRad);

      if (slice.highlighted){
        var starRadius = r * 0.225;
        var chordWidth = 2 * starRadius * Math.sin((unitSpan / 2) * Math.PI / 180);
        var starOuterR = Math.max(4, Math.min(14, chordWidth * 0.34));
        drawStar(starRadius, 0, starOuterR, starOuterR * 0.45, "#FFDD66");
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = slice.color.text;
      ctx.letterSpacing = "0.5px";
      ctx.font = "600 " + fit.fontSize + "px 'Bebas Neue', sans-serif";
      var startY = -(fit.lines.length - 1) * lineHeight / 2;
      fit.lines.forEach(function(line, idx){
        ctx.fillText(line, labelRadius, startY + idx * lineHeight);
      });
      ctx.restore();
    });

    // decorative rim
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#EB4D00";
    ctx.stroke();

    // extra gold rim accent over highlighted slices, so the featured prize
    // reads as special even from the wheel's outer silhouette while spinning
    slices.forEach(function(slice){
      if (!slice.highlighted) return;
      var startRad = (slice.start - 90) * Math.PI / 180;
      var endRad   = (slice.end   - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.arc(cx, cy, r, startRad, endRad);
      ctx.lineWidth = 7;
      ctx.strokeStyle = "#FFB800";
      ctx.stroke();
    });

    updateSpinAvailability();
  }

  function resetRotation(){
    state.rotation = 0;
    wheelWrap.style.transition = "none";
    wheelWrap.style.transform = "rotate(0deg)";
    // force reflow so the next transition applies cleanly
    void wheelWrap.offsetHeight;
  }

  function updateSpinAvailability(){
    var t = I18N[state.lang];
    var activeCount = state.prizes.filter(function(p){ return p.enabled && p.weight > 0; }).length;
    var notEnough = activeCount < 2;
    spinBtn.disabled = notEnough || state.spinning;
    spinHint.textContent = notEnough ? t.hintNotEnough : (state.spinning ? t.hintSpinning : t.hintTapWheel);
    wheelWrap.classList.toggle("is-idle", !notEnough && !state.spinning);
  }

  // ---------- prize list UI ----------
  function renderPrizeList(){
    var t = I18N[state.lang];
    prizeListEl.innerHTML = "";
    state.prizes.forEach(function(p, i){
      var li = document.createElement("li");
      li.className = "prize-row" + (p.enabled ? "" : " is-disabled");
      li.dataset.id = p.id;

      var swatchColor = p.highlighted ? HIGHLIGHT_COLOR.bg : PALETTE[i % PALETTE.length].bg;

      li.innerHTML =
        '<input type="checkbox" class="enabled-toggle" ' + (p.enabled ? "checked" : "") + ' aria-label="' + escapeHtml(t.ariaPrizeActive) + '">' +
        '<button type="button" class="star-toggle" aria-pressed="' + (p.highlighted ? "true" : "false") + '" aria-label="' + escapeHtml(t.ariaHighlight) + '">' +
          '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>' +
        '</button>' +
        '<div class="label-field">' +
          '<span class="swatch" style="background:' + swatchColor + '" aria-hidden="true"></span>' +
          '<input type="text" class="label-input" value="' + escapeHtml(prizeLabel(p)) + '" maxlength="40" aria-label="' + escapeHtml(t.ariaPrizeName) + '">' +
        '</div>' +
        '<div>' +
          '<span class="odds-label">' + escapeHtml(t.oddsLabel) + '</span>' +
          '<input type="number" class="weight-input" min="1" max="10" value="' + p.weight + '" aria-label="' + escapeHtml(t.ariaOddsWeight) + '">' +
        '</div>' +
        '<button type="button" class="remove-btn" aria-label="' + escapeHtml(t.ariaRemove) + '">&times;</button>';

      prizeListEl.appendChild(li);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function findPrize(id){
    return state.prizes.find(function(p){ return p.id === id; });
  }

  prizeListEl.addEventListener("change", function(e){
    var li = e.target.closest(".prize-row");
    if (!li) return;
    var prize = findPrize(li.dataset.id);
    if (!prize) return;

    if (e.target.classList.contains("enabled-toggle")){
      prize.enabled = e.target.checked;
      li.classList.toggle("is-disabled", !prize.enabled);
    } else if (e.target.classList.contains("weight-input")){
      var w = parseInt(e.target.value, 10);
      prize.weight = isNaN(w) ? 1 : Math.min(10, Math.max(1, w));
      e.target.value = prize.weight;
    } else if (e.target.classList.contains("label-input")){
      var val = e.target.value.trim();
      prize.customLabel = val || prizeLabel(prize);
      e.target.value = prizeLabel(prize);
    } else {
      return;
    }
    renderWheel();
    resetRotation();
  });

  prizeListEl.addEventListener("click", function(e){
    var starBtn = e.target.closest(".star-toggle");
    if (starBtn){
      var starLi = e.target.closest(".prize-row");
      var starPrize = findPrize(starLi.dataset.id);
      if (starPrize){
        starPrize.highlighted = !starPrize.highlighted;
        renderPrizeList();
        renderWheel();
      }
      return;
    }
    var btn = e.target.closest(".remove-btn");
    if (!btn) return;
    var li = e.target.closest(".prize-row");
    state.prizes = state.prizes.filter(function(p){ return p.id !== li.dataset.id; });
    renderPrizeList();
    renderWheel();
    resetRotation();
  });

  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var label = newLabelEl.value.trim();
    if (!label) return;
    var weight = parseInt(newWeightEl.value, 10);
    weight = isNaN(weight) ? 1 : Math.min(10, Math.max(1, weight));

    state.prizes.push({ id:"p" + (nextId++), key:null, customLabel:label, weight:weight, enabled:true, highlighted:false });
    newLabelEl.value = "";
    newWeightEl.value = "1";
    renderPrizeList();
    renderWheel();
    resetRotation();
    newLabelEl.focus();
  });

  resetBtn.addEventListener("click", function(){
    state.prizes = makePrizes(DEFAULT_PRIZES);
    renderPrizeList();
    renderWheel();
    resetRotation();
  });

  // ---------- spin logic ----------
  function spin(){
    if (state.spinning) return;
    if (state.slices.length < 2) { updateSpinAvailability(); return; }

    state.spinning = true;
    spinBtn.disabled = true;
    spinHint.textContent = I18N[state.lang].hintSpinning;
    wheelWrap.classList.remove("is-idle");

    var a = Math.random() * 360;
    var landed = state.slices.find(function(s){ return a >= s.start && a < s.end; }) || state.slices[state.slices.length - 1];

    var r = (360 - a) % 360;
    var extraTurns = 6 + Math.floor(Math.random() * 3); // 6-8 full turns
    var currentMod = ((state.rotation % 360) + 360) % 360;
    var deltaToAdd = ((r - currentMod) + 360) % 360 + extraTurns * 360;
    var newRotation = state.rotation + deltaToAdd;

    var duration = reduceMotion ? 0.6 : 4.4;
    wheelWrap.style.transition = "transform " + duration + "s cubic-bezier(0.12,0.72,0.15,1)";

    var settled = false;
    var fallbackId = null;
    var onDone = function(ev){
      if (ev && ev.propertyName !== "transform") return;
      if (settled) return;
      settled = true;
      wheelWrap.removeEventListener("transitionend", onDone);
      if (fallbackId !== null) clearTimeout(fallbackId);
      state.spinning = false;
      updateSpinAvailability();
      showResult(landed);
      logSpinToSheet(landed);
    };
    wheelWrap.addEventListener("transitionend", onDone);

    requestAnimationFrame(function(){
      wheelWrap.style.transform = "rotate(" + newRotation + "deg)";
    });
    state.rotation = newRotation;

    // safety fallback in case transitionend doesn't fire
    fallbackId = setTimeout(onDone, (duration * 1000) + 400);
  }

  spinBtn.addEventListener("click", spin);

  // ---------- result + confetti ----------
  function showResult(slice){
    resultTitle.textContent = slice.label;
    overlay.hidden = false;
    burstConfetti();
    closeResultBtn.focus();
  }

  function closeResult(){
    overlay.hidden = true;
    confettiLayer.innerHTML = "";
  }

  function burstConfetti(){
    confettiLayer.innerHTML = "";
    if (reduceMotion) return;
    var colors = PALETTE.map(function(p){ return p.bg; });
    for (var i = 0; i < 60; i++){
      var el = document.createElement("span");
      el.className = "confetti-piece";
      var isDot = Math.random() < 0.35;
      el.style.left = (Math.random() * 100) + "%";
      el.style.background = colors[i % colors.length];
      el.style.width = isDot ? "8px" : "7px";
      el.style.height = isDot ? "8px" : (10 + Math.random() * 10) + "px";
      el.style.borderRadius = isDot ? "50%" : "1px";
      el.style.animationDelay = (Math.random() * 0.5) + "s";
      el.style.animationDuration = (2 + Math.random() * 1.6) + "s";
      confettiLayer.appendChild(el);
    }
  }

  closeResultBtn.addEventListener("click", closeResult);
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closeResult();
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (!overlay.hidden) closeResult();
    if (settingsPanel.classList.contains("is-open")) closeSettings();
  });

  // ---------- settings drawer ----------
  function openSettings(){
    settingsPanel.removeAttribute("inert");
    settingsPanel.classList.add("is-open");
    settingsBackdrop.classList.add("is-open");
    document.body.style.overflow = "hidden";
    closeSettingsBtn.focus();
  }

  function closeSettings(){
    settingsPanel.classList.remove("is-open");
    settingsBackdrop.classList.remove("is-open");
    settingsPanel.setAttribute("inert", "");
    document.body.style.overflow = "";
    settingsBtn.focus();
  }

  settingsBtn.addEventListener("click", openSettings);
  closeSettingsBtn.addEventListener("click", closeSettings);
  settingsBackdrop.addEventListener("click", closeSettings);

  // ---------- spin logging (Google Sheet) ----------
  function logSpinToSheet(slice){
    if (!LOG_ENDPOINT) return;
    var payload = {
      prize: slice.label,
      datetime: new Date().toISOString(),
      language: state.lang
    };
    // Apps Script Web Apps don't return CORS headers we can read from a static
    // page, so this is fire-and-forget: we send the row and don't wait on or
    // parse a response. A failed request (offline, endpoint down) is swallowed
    // so it never interrupts the spin experience.
    fetch(LOG_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(function(){});
  }

  // ---------- language switch ----------
  function applyTranslations(){
    var t = I18N[state.lang];
    document.title = t.docTitle;
    document.documentElement.lang = state.lang;

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      if (t[key] != null) el.textContent = t[key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){
      var key = el.getAttribute("data-i18n-placeholder");
      if (t[key] != null) el.placeholder = t[key];
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function(el){
      var key = el.getAttribute("data-i18n-aria");
      if (t[key] != null) el.setAttribute("aria-label", t[key]);
    });

    langPtBtn.setAttribute("aria-pressed", String(state.lang === "pt"));
    langEnBtn.setAttribute("aria-pressed", String(state.lang === "en"));
  }

  function setLanguage(lang){
    if (lang === state.lang || !I18N[lang]) return;
    state.lang = lang;
    applyTranslations();
    renderPrizeList();
    renderWheel();
    updateSpinAvailability();
    scheduleFit();
  }

  langPtBtn.addEventListener("click", function(){ setLanguage("pt"); });
  langEnBtn.addEventListener("click", function(){ setLanguage("en"); });

  // ---------- fit to screen ----------
  function fitToScreen(){
    // offsetWidth/offsetHeight reflect the untransformed layout box, so this
    // works regardless of whatever scale is already applied.
    var naturalW = appEl.offsetWidth;
    var naturalH = appEl.offsetHeight;
    if (!naturalW || !naturalH) return;
    var scale = Math.min(1, window.innerWidth / naturalW, window.innerHeight / naturalH);
    appEl.style.transform = "translate(-50%,-50%) scale(" + scale.toFixed(4) + ")";
  }

  var fitScheduled = false;
  function scheduleFit(){
    if (fitScheduled) return;
    fitScheduled = true;
    requestAnimationFrame(function(){
      fitScheduled = false;
      fitToScreen();
    });
  }

  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(scheduleFit);
  }

  // ---------- init ----------
  applyTranslations();
  renderPrizeList();
  renderWheel();
  updateSpinAvailability();
  scheduleFit();
})();
</script>
</body>
</html>
